<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone Caméra P2P</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        .ios-glass {
            background: rgba(28, 28, 30, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3">

    <header class="text-center py-2">
        <h1 class="text-lg font-semibold tracking-tight">Caméra P2P iOS</h1>
        <p id="status-text" class="text-xs text-gray-400">Prêt à connecter</p>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center max-w-md mx-auto w-full my-auto">

        <div id="view-menu" class="w-full space-y-3">
            <div class="ios-glass p-4 rounded-3xl text-center space-y-3 shadow-2xl">
                <h2 class="text-base font-medium">Choisissez votre rôle</h2>
                <p class="text-xs text-gray-400">Transformez l'un de vos iPhones en caméra et l'autre en moniteur.</p>
                
                <div class="space-y-2 pt-1">
                    <button onclick="startSender()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 active:scale-95 transition rounded-2xl font-medium shadow-lg text-white flex items-center justify-center space-x-2 text-sm">
                        <span>📹</span>
                        <span>Émettre (Caméra)</span>
                    </button>
                    <button onclick="showReceiverInput()" class="w-full py-3 ios-glass hover:bg-white/10 active:scale-95 transition rounded-2xl font-medium shadow-lg text-white flex items-center justify-center space-x-2 border border-white/20 text-sm">
                        <span>📱</span>
                        <span>Observer (Moniteur)</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="view-receiver-input" class="w-full space-y-3 hidden">
            <div class="ios-glass p-4 rounded-3xl text-center space-y-3 shadow-2xl">
                <h2 class="text-base font-medium">Entrer le code de la caméra</h2>
                <p class="text-xs text-gray-400">Tapez le code à 4 chiffres affiché sur l'autre iPhone.</p>
                
                <input type="text" id="peer-code-input" maxlength="4" placeholder="0000" class="w-40 mx-auto text-center text-2xl tracking-widest bg-black/50 border border-white/20 rounded-2xl py-2 text-white focus:outline-none focus:border-blue-500">
                
                <div class="space-y-2 pt-1">
                    <button onclick="connectToSender()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 active:scale-95 transition rounded-2xl font-medium text-white text-sm">
                        Se connecter
                    </button>
                    <button onclick="resetApp()" class="w-full py-2 text-xs text-gray-400 hover:text-white transition">
                        Retour
                    </button>
                </div>
            </div>
        </div>

        <div id="view-sender" class="w-full space-y-2 hidden text-center">
            <div class="ios-glass p-4 rounded-3xl space-y-2 shadow-2xl">
                <h2 class="text-xs font-medium text-gray-300">Code d'appairage</h2>
                <div id="code-display" class="text-4xl font-bold tracking-widest text-blue-400 py-1">----</div>
                
                <div id="qrcode-container" class="bg-white p-2 rounded-xl inline-block mx-auto shadow-inner"></div>
                
                <div class="pt-1">
                    <video id="local-video" autoplay playsinline muted class="w-full h-36 object-cover rounded-xl bg-black border border-white/10"></video>
                </div>

                <div class="grid grid-cols-2 gap-2 pt-1">
                    <button onclick="switchCamera()" class="py-2 ios-glass hover:bg-white/10 rounded-xl text-xs font-medium flex items-center justify-center space-x-1">
                        <span>🔄</span><span>Changer cam</span>
                    </button>
                    <button onclick="toggleTorch()" class="py-2 ios-glass hover:bg-white/10 rounded-xl text-xs font-medium flex items-center justify-center space-x-1">
                        <span>🔦</span><span>Torche</span>
                    </button>
                </div>

                <button onclick="resetApp()" class="w-full py-2 text-xs text-red-400 hover:text-red-300 transition">
                    Arrêter la diffusion
                </button>
            </div>
        </div>

        <div id="view-monitor" class="w-full space-y-2 hidden">
            <div class="relative w-full rounded-2xl overflow-hidden ios-glass shadow-2xl aspect-[3/4] flex items-center justify-center bg-black max-h-[60vh]">
                <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
                <div id="connecting-overlay" class="absolute inset-flex flex-col items-center justify-center bg-black/80 space-y-2">
                    <div class="w-6 h-6 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-xs text-gray-300">Connexion en cours...</p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <button onclick="takeSnapshot()" class="py-2.5 ios-glass hover:bg-white/10 rounded-xl text-xs font-medium flex items-center justify-center space-x-1">
                    <span>📸</span><span>Capturer</span>
                </button>
                <button onclick="resetApp()" class="py-2.5 bg-red-600/80 hover:bg-red-600 rounded-xl text-xs font-medium text-white">
                    Quitter
                </button>
            </div>
        </div>

    </main>

    <footer class="text-center py-1 text-[9px] text-gray-600">
        WebRTC P2P Stream
    </footer>

    <script>
        let peer = null;
        let localStream = null;
        let currentConnection = null;
        let currentCall = null;
        let usingFrontCamera = false;
        let activeTorch = false;
        let generatedCode = "";

        function showView(viewId) {
            ['view-menu', 'view-receiver-input', 'view-sender', 'view-monitor'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
        }

        function resetApp() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            if (peer) {
                peer.destroy();
                peer = null;
            }
            currentConnection = null;
            currentCall = null;
            document.getElementById('status-text').innerText = "Prêt à connecter";
            showView('view-menu');
        }

        function generateRandomCode() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }

        async function startSender() {
            try {
                generatedCode = generateRandomCode();
                document.getElementById('code-display').innerText = generatedCode;

                const qrContainer = document.getElementById('qrcode-container');
                qrContainer.innerHTML = "";
                const qr = qrcode(0, 'L');
                qr.addData(window.location.href);
                qr.make();
                qrContainer.innerHTML = qr.createImgTag(3);

                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" } },
                    audio: true
                });
                document.getElementById('local-video').srcObject = localStream;

                const peerId = "ioscam-" + generatedCode;
                peer = new Peer(peerId);

                peer.on('open', (id) => {
                    document.getElementById('status-text').innerText = "En attente d'un moniteur...";
                });

                peer.on('call', (call) => {
                    currentCall = call;
                    call.answer(localStream);
                    document.getElementById('status-text').innerText = "En direct connecté";
                });

                peer.on('error', (err) => {
                    alert("Erreur de connexion : " + err.type);
                    resetApp();
                });

                showView('view-sender');
            } catch (err) {
                alert("Impossible d'accéder à la caméra : " + err.message);
                resetApp();
            }
        }

        async function switchCamera() {
            if (!localStream) return;
            usingFrontCamera = !usingFrontCamera;
            localStream.getTracks().forEach(track => track.stop());
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: usingFrontCamera ? "user" : "environment" },
                    audio: true
                });
                document.getElementById('local-video').srcObject = localStream;
                if (currentCall) {
                    const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                    if (sender) sender.replaceTrack(localStream.getVideoTracks()[0]);
                }
            } catch (err) {
                alert("Erreur basculement caméra");
            }
        }

        async function toggleTorch() {
            try {
                const track = localStream.getVideoTracks()[0];
                const capabilities = track.getCapabilities();
                if (capabilities.torch) {
                    activeTorch = !activeTorch;
                    await track.applyConstraints({ advanced: [{ torch: activeTorch }] });
                } else {
                    alert("Lampe torche non disponible.");
                }
            } catch (e) {
                alert("Impossible d'activer la torche.");
            }
        }

        function showReceiverInput() {
            showView('view-receiver-input');
        }

        function connectToSender() {
            const code = document.getElementById('peer-code-input').value.trim();
            if (code.length !== 4) {
                alert("Veuillez entrer un code valide à 4 chiffres.");
                return;
            }

            showView('view-monitor');
            document.getElementById('connecting-overlay').style.display = 'flex';

            peer = new Peer();

            peer.on('open', () => {
                const targetPeerId = "ioscam-" + code;
                const dummyStream = new MediaStream();
                const call = peer.call(targetPeerId, dummyStream);

                currentCall = call;

                call.on('stream', (remoteStream) => {
                    const remoteVideo = document.getElementById('remote-video');
                    remoteVideo.srcObject = remoteStream;
                    document.getElementById('connecting-overlay').style.display = 'none';
                    document.getElementById('status-text').innerText = "Connecté à la caméra";
                });

                call.on('close', () => {
                    alert("La diffusion a été arrêtée.");
                    resetApp();
                });

                call.on('error', (err) => {
                    alert("Erreur de flux vidéo.");
                    resetApp();
                });
            });

            peer.on('error', (err) => {
                alert("Code incorrect ou caméra introuvable.");
                resetApp();
            });
        }

        function takeSnapshot() {
            const video = document.getElementById('remote-video');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const link = document.createElement('a');
            link.download = 'capture-iphone.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
